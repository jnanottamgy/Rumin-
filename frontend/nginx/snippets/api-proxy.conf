# Passing a request to the API. The client's address and scheme travel in X-Forwarded-*
# (overwritten, never appended, so a client cannot choose them); the browser's own Host is
# kept, which the API's cross-site check compares with the Origin. nginx's request ID
# becomes the API's, so a request can be followed through both logs.
proxy_pass http://rumin_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
add_header Strict-Transport-Security "max-age=31536000" always;
