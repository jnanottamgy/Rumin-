# Security headers for the web app's own responses (the API sets its own on JSON).
# Included in every location that serves a file, because nginx drops inherited
# add_header directives from a block that adds any of its own.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Scripts, styles, fonts and data come only from this origin: no inline script, no eval, no
# third party. Images may also be data: or blob: URLs (icons, exported files).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
